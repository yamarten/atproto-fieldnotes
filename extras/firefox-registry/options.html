<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project Registryの接続先</title><link rel="stylesheet" href="options.css"></head>
<body>
  <main>
    <h1>Project Registryの接続先</h1>
    <form id="settings">
      <label for="registry-url">Web UIのルートURL</label>
      <input id="registry-url" type="url" required placeholder="https://your-registry.example/">
      <p>普段ログインしている接続先を指定してください。APIトークンはWeb UI側で入力します。</p>
      <label for="open-mode">開き方</label>
      <select id="open-mode"><option value="popup">ポップアップ</option><option value="tab">タブ</option></select>
      <button type="submit">保存</button>
    </form>
    <p id="status" role="status"></p>
    <p>操作したタブのURLだけをWeb UIへ渡します（クエリ文字列・フラグメントを除く）。</p>
  </main>
  <script src="entry.js"></script><script src="options.js"></script>
</body>
</html>
