<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1100" viewBox="0 0 2000 1100" role="img"><title>接続構成</title><desc>利用者のブラウザはWebサーバーを、ターミナルはCLIを使う。Webの長時間処理は別プロセスのworkerで実行する。共通処理がSQLite、LLM、調査ブラウザを利用する。情報源はGitHub・Tangled、Bluesky・Semble、collectiondata.usounds.workのcollection inventory、Jetstreamの公開record、DNS・DID document・PDS、Webサイト。ブラウザはWebサイトを閲覧する。境界はツールの構成範囲であり、ホスト配置を限定しない。</desc>
