<path d="M1120,360 H1272" fill="none" stroke="#087F78" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M1259,354 L1272,360 L1259,366" fill="none" stroke="#087F78" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="760" y="591" font-family="Hiragino Sans, Noto Sans JP, sans-serif" font-size="23" font-weight="500" fill="#697D83" text-anchor="middle">採用済みrepoがない場合</text>
<path d="M1510,480 V682" fill="none" stroke="#087F78" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M1516,669 L1510,682 L1504,669" fill="none" stroke="#087F78" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M1316,700 H1704 Q1730,700 1730,726 V914 Q1730,940 1704,940 H1316 Q1290,940 1290,914 V726 Q1290,700 1316,700 Z" fill="#EFF4FB" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1318" y="743" font-family="Hiragino Sans, Noto Sans JP, sans-serif" font-size="21" font-weight="600" fill="#426EAA" text-anchor="start">04</text>
<path d="M1547.5,719 H1682.5 Q1702,719 1702,738.5 V738.5 Q1702,758 1682.5,758 H1547.5 Q1528,758 1528,738.5 V738.5 Q1528,719 1547.5,719 Z" fill="#FFFFFF" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1615" y="746" font-family="Hiragino Sans, Noto Sans JP, sans-serif" font-size="20" font-weight="500" fill="#426EAA" text-anchor="middle">LLM</text>
<text x="1318" y="798" font-family="Hiragino Sans, Noto Sans JP, sans-serif" font-size="30" font-weight="600" fill="#173D48" text-anchor="start">説明・分類の更新案</text>
<text x="1318" y="848" font-family="Hiragino Sans, Noto Sans JP, sans-serif" font-size="23" font-weight="400" fill="#173D48" text-anchor="start">集めた根拠と既存情報を参照</text>
<text x="1318" y="884" font-family="Hiragino Sans, Noto Sans JP, sans-serif" font-size="23" font-weight="400" fill="#173D48" text-anchor="start">説明・分類・状態を補完</text>
<path d="M706,700 H1094 Q1120,700 1120,726 V914 Q1120,940 1094,940 H706 Q680,940 680,914 V726 Q680,700 706,700 Z" fill="#EDF8F3" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="708" y="743" font-family="Hiragino Sans, Noto Sans JP, sans-serif" font-size="21" font-weight="600" fill="#087F78" text-anchor="start">05</text>
<path d="M937.5,719 H1072.5 Q1092,719 1092,738.5 V738.5 Q1092,758 1072.5,758 H937.5 Q918,758 918,738.5 V738.5 Q918,719 937.5,719 Z" fill="#FFFFFF" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1005" y="746" font-family="Hiragino Sans, Noto Sans JP, sans-serif" font-size="20" font-weight="500" fill="#087F78" text-anchor="middle">評価</text>
<text x="708" y="798" font-family="Hiragino Sans, Noto Sans JP, sans-serif" font-size="30" font-weight="600" fill="#173D48" text-anchor="start">帰属・状態を再評価</text>
<text x="708" y="848" font-family="Hiragino Sans, Noto Sans JP, sans-serif" font-size="23" font-weight="400" fill="#173D48" text-anchor="start">信頼経路・手動判断を照合</text>
<text x="708" y="884" font-family="Hiragino Sans, Noto Sans JP, sans-serif" font-size="23" font-weight="400" fill="#173D48" text-anchor="start">重複候補・マージ推奨を更新</text>
<path d="M96,700 H484 Q510,700 510,726 V914 Q510,940 484,940 H96 Q70,940 70,914 V726 Q70,700 96,700 Z" fill="#EDF8F3" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="98" y="743" font-family="Hiragino Sans, Noto Sans JP, sans-serif" font-size="21" font-weight="600" fill="#087F78" text-anchor="start">06</text>
<path d="M327.5,719 H462.5 Q482,719 482,738.5 V738.5 Q482,758 462.5,758 H327.5 Q308,758 308,738.5 V738.5 Q308,719 327.5,719 Z" fill="#FFFFFF" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="395" y="746" font-family="Hiragino Sans, Noto Sans JP, sans-serif" font-size="20" font-weight="500" fill="#087F78" text-anchor="middle">記録</text>
<text x="98" y="798" font-family="Hiragino Sans, Noto Sans JP, sans-serif" font-size="30" font-weight="600" fill="#173D48" text-anchor="start">保存</text>
<text x="98" y="848" font-family="Hiragino Sans, Noto Sans JP, sans-serif" font-size="23" font-weight="400" fill="#173D48" text-anchor="start">現在状態 ＋ 調査履歴</text>
<text x="98" y="884" font-family="Hiragino Sans, Noto Sans JP, sans-serif" font-size="23" font-weight="400" fill="#173D48" text-anchor="start">更新番号で競合を検査</text>
<text x="98" y="920" font-family="Hiragino Sans, Noto Sans JP, sans-serif" font-size="23" font-weight="400" fill="#173D48" text-anchor="start">競合時は未反映の履歴を保存</text>
