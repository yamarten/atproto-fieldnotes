<text x="1318" y="283" font-family="Hiragino Sans, Noto Sans JP, sans-serif" font-size="21" font-weight="600" fill="#087F78" text-anchor="start">03</text>
<path d="M1547.5,259 H1682.5 Q1702,259 1702,278.5 V278.5 Q1702,298 1682.5,298 H1547.5 Q1528,298 1528,278.5 V278.5 Q1528,259 1547.5,259 Z" fill="#FFFFFF" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1615" y="286" font-family="Hiragino Sans, Noto Sans JP, sans-serif" font-size="20" font-weight="500" fill="#087F78" text-anchor="middle">取得</text>
<text x="1318" y="338" font-family="Hiragino Sans, Noto Sans JP, sans-serif" font-size="30" font-weight="600" fill="#173D48" text-anchor="start">追加調査</text>
<text x="1318" y="388" font-family="Hiragino Sans, Noto Sans JP, sans-serif" font-size="23" font-weight="400" fill="#173D48" text-anchor="start">固定規則で検索語を生成</text>
<text x="1318" y="424" font-family="Hiragino Sans, Noto Sans JP, sans-serif" font-size="23" font-weight="400" fill="#173D48" text-anchor="start">collector：検索・取得を実行</text>
<text x="1318" y="460" font-family="Hiragino Sans, Noto Sans JP, sans-serif" font-size="23" font-weight="400" fill="#173D48" text-anchor="start">根拠を現在情報へ統合</text>
<path d="M510,360 H662" fill="none" stroke="#087F78" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M649,354 L662,360 L649,366" fill="none" stroke="#087F78" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="595" y="329" font-family="Hiragino Sans, Noto Sans JP, sans-serif" font-size="21" font-weight="500" fill="#087F78" text-anchor="middle">採用済みrepo</text>
