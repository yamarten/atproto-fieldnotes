<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000" role="img"><title>調査フロー</title><desc>登録済みの1件を調査する順序。初期収集とrepo帰属確認の後、採用済みrepoをLLMで解析する。採用済みrepoがなければこの解析を飛ばす。追加調査は識別子・名前から固定規則で検索語を生成し、collectorが検索・取得を行う。LLMが説明・分類の更新案を作り、手動判断を尊重して帰属・状態を再評価し、現在状態と調査履歴を保存する。</desc>
<path d="M0,0 H1800 Q1800,0 1800,0 V1000 Q1800,1000 1800,1000 H0 Q0,1000 0,1000 V0 Q0,0 0,0 Z" fill="#FFFFFF" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="70" y="82" font-family="Hiragino Sans, Noto Sans JP, sans-serif" font-size="43" font-weight="600" fill="#173D48" text-anchor="start">調査フロー</text>
<path d="M88,135 H492 Q510,135 510,153 V177 Q510,195 492,195 H88 Q70,195 70,177 V153 Q70,135 88,135 Z" fill="#F3F5F5" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="290" y="175" font-family="Hiragino Sans, Noto Sans JP, sans-serif" font-size="26" font-weight="500" fill="#173D48" text-anchor="middle">登録済み情報・手動判断</text>
