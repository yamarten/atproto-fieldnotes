<text x="98" y="283" font-family="Hiragino Sans, Noto Sans JP, sans-serif" font-size="21" font-weight="600" fill="#087F78" text-anchor="start">01</text>
<path d="M327.5,259 H462.5 Q482,259 482,278.5 V278.5 Q482,298 462.5,298 H327.5 Q308,298 308,278.5 V278.5 Q308,259 327.5,259 Z" fill="#FFFFFF" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="395" y="286" font-family="Hiragino Sans, Noto Sans JP, sans-serif" font-size="20" font-weight="500" fill="#087F78" text-anchor="middle">取得・評価</text>
<text x="98" y="338" font-family="Hiragino Sans, Noto Sans JP, sans-serif" font-size="30" font-weight="600" fill="#173D48" text-anchor="start">初期収集・帰属確認</text>
<text x="98" y="388" font-family="Hiragino Sans, Noto Sans JP, sans-serif" font-size="23" font-weight="400" fill="#173D48" text-anchor="start">既知のURL・repo・Lexiconを調査</text>
<text x="98" y="424" font-family="Hiragino Sans, Noto Sans JP, sans-serif" font-size="23" font-weight="400" fill="#173D48" text-anchor="start">候補repoの逆リンクを先に確認</text>
<path d="M706,240 H1094 Q1120,240 1120,266 V454 Q1120,480 1094,480 H706 Q680,480 680,454 V266 Q680,240 706,240 Z" fill="#EFF4FB" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="708" y="283" font-family="Hiragino Sans, Noto Sans JP, sans-serif" font-size="21" font-weight="600" fill="#426EAA" text-anchor="start">02</text>
<path d="M937.5,259 H1072.5 Q1092,259 1092,278.5 V278.5 Q1092,298 1072.5,298 H937.5 Q918,298 918,278.5 V278.5 Q918,259 937.5,259 Z" fill="#FFFFFF" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1005" y="286" font-family="Hiragino Sans, Noto Sans JP, sans-serif" font-size="20" font-weight="500" fill="#426EAA" text-anchor="middle">LLM ＋ 確認</text>
<text x="708" y="338" font-family="Hiragino Sans, Noto Sans JP, sans-serif" font-size="30" font-weight="600" fill="#173D48" text-anchor="start">repo解析</text>
<text x="708" y="388" font-family="Hiragino Sans, Noto Sans JP, sans-serif" font-size="23" font-weight="400" fill="#173D48" text-anchor="start">採用済みrepoの素材を解析</text>
<text x="708" y="424" font-family="Hiragino Sans, Noto Sans JP, sans-serif" font-size="23" font-weight="400" fill="#173D48" text-anchor="start">条件が合う解析結果は再利用</text>
<text x="708" y="460" font-family="Hiragino Sans, Noto Sans JP, sans-serif" font-size="23" font-weight="400" fill="#173D48" text-anchor="start">解析後に公開先を追加確認</text>
