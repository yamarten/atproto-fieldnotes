<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project Registry</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body data-screen="review">
  <header class="app-header">
    <div class="brand-row">
      <div>
        <p class="eyebrow">atproto調査</p>
        <h1>Project Registry</h1>
      </div>
      <button id="refresh" class="secondary">再読込</button>
    </div>
    <nav class="primary-nav" aria-label="メインナビゲーション">
      <button data-screen="review" class="active">レビュー</button>
      <button data-screen="projects">登録プロジェクト</button>
      <button data-screen="operations">処理・定期実行</button>
      <button data-screen="settings">設定</button>
    </nav>
    <div id="status" class="status" role="status"></div>
  </header>

  <main>
    <section id="workspace" class="workspace">
      <div class="list-pane">
        <div id="list-controls"></div>
        <div id="list" class="list"></div>
      </div>
      <aside id="detail" class="detail-pane">
        <div class="empty-state"><h2>登録プロジェクトを選択</h2></div>
      </aside>
    </section>
    <section id="single-pane" class="single-pane" hidden></section>
  </main>

  <div id="context-help-popover" class="context-help-popover" popover="auto" role="region" aria-labelledby="context-help-title">
    <div class="card-title"><h3 id="context-help-title"></h3><button id="context-help-close" type="button" class="small secondary" aria-label="説明を閉じる">×</button></div>
    <div id="context-help-body"></div>
  </div>

  <dialog id="confirm-dialog" tabindex="-1" autofocus>
    <form method="dialog">
      <p id="confirm-context" class="eyebrow">データベースへの変更を確認</p>
      <h2 id="confirm-title">操作を確認</h2>
      <p id="confirm-message"></p>
      <label id="confirm-note-label"><span id="confirm-note-text">理由・メモ</span>
        <input id="confirm-note" type="text" autocomplete="off">
      </label>
      <div class="dialog-actions">
        <button value="cancel" class="secondary">キャンセル</button>
        <button id="confirm-submit" value="confirm" class="danger">変更を適用</button>
      </div>
    </form>
  </dialog>

  <dialog id="profile-dialog" tabindex="-1" autofocus>
    <form method="dialog">
      <p class="eyebrow">紹介情報を編集</p>
      <h2>登録プロジェクトの情報</h2>
      <label>名前<input id="profile-name" type="text"></label>
      <label>概要<input id="profile-tagline" type="text" maxlength="30"></label>
      <label>説明<textarea id="profile-summary" rows="6" maxlength="8000"></textarea></label>
      <label>特徴（1行に1項目、最大6件）<textarea id="profile-features" rows="4"></textarea></label>
      <label><input id="profile-automatic" type="checkbox">根拠のある説明変更を自動反映する</label>
      <p class="muted">説明を編集すると自動反映は解除されます。</p>
      <div id="profile-proposal"></div>
      <label>紹介投稿のURL<input id="profile-introduced-url" type="url" placeholder="https://bsky.app/profile/yamarten.bsky.social/post/..."></label>
      <label>メモ<textarea id="profile-notes" rows="6"></textarea></label>
      <div id="profile-diff"></div>
      <div class="dialog-actions">
        <button value="cancel" class="secondary">キャンセル</button>
        <button id="profile-preview" type="button">プレビュー</button>
        <button id="profile-apply" type="button" class="primary" disabled>適用</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="/app.js"></script>
</body>
</html>
