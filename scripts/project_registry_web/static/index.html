<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project Registry</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body data-screen="review">
  <header class="app-header">
    <div class="brand-row">
      <div>
        <p class="eyebrow">atproto survey</p>
        <h1>Project Registry</h1>
      </div>
      <button id="refresh" class="secondary">Refresh</button>
    </div>
    <nav class="primary-nav" aria-label="Primary">
      <button data-screen="review" class="active">Review</button>
      <button data-screen="projects">Projects</button>
      <button data-screen="operations">Operations</button>
      <button data-screen="settings">Settings</button>
    </nav>
    <div id="status" class="status" role="status"></div>
  </header>

  <main>
    <section id="workspace" class="workspace">
      <div class="list-pane">
        <div id="list-controls"></div>
        <div id="list" class="list"></div>
      </div>
      <aside id="detail" class="detail-pane">
        <div class="empty-state"><h2>Select a project</h2><p>Review normalized identifiers, evidence, and operator decisions.</p></div>
      </aside>
    </section>
    <section id="single-pane" class="single-pane" hidden></section>
  </main>

  <dialog id="confirm-dialog" tabindex="-1" autofocus>
    <form method="dialog">
      <p id="confirm-context" class="eyebrow">Confirm database change</p>
      <h2 id="confirm-title">Confirm action</h2>
      <p id="confirm-message"></p>
      <label id="confirm-note-label"><span id="confirm-note-text">Reason or note</span>
        <input id="confirm-note" type="text" autocomplete="off">
      </label>
      <div class="dialog-actions">
        <button value="cancel" class="secondary">Cancel</button>
        <button id="confirm-submit" value="confirm" class="danger">Apply change</button>
      </div>
    </form>
  </dialog>

  <dialog id="profile-dialog" tabindex="-1" autofocus>
    <form method="dialog">
      <p class="eyebrow">Edit profile</p>
      <h2>Project fields</h2>
      <label>Name<input id="profile-name" type="text"></label>
      <label>Tagline<input id="profile-tagline" type="text" maxlength="30"></label>
      <label>Summary<textarea id="profile-summary" rows="6" maxlength="8000"></textarea></label>
      <label>Features (one per line, up to 6)<textarea id="profile-features" rows="4"></textarea></label>
      <label><input id="profile-automatic" type="checkbox">根拠のある説明変更を自動反映する</label>
      <p class="muted">用途・技術的特徴を残し、過去の特徴には時点を添えます。説明を編集すると自動反映は解除されます。</p>
      <div id="profile-proposal"></div>
      <label>Introduced URL<input id="profile-introduced-url" type="url" placeholder="https://bsky.app/profile/yamarten.bsky.social/post/..."></label>
      <label>Notes<textarea id="profile-notes" rows="6"></textarea></label>
      <div id="profile-diff"></div>
      <div class="dialog-actions">
        <button value="cancel" class="secondary">Cancel</button>
        <button id="profile-preview" type="button">Preview</button>
        <button id="profile-apply" type="button" class="primary" disabled>Apply</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="/app.js"></script>
</body>
</html>
